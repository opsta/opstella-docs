<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Opstella Observability architecture: applications, Kubernetes, API Gateway and databases send telemetry through Grafana Alloy into Mimir, Loki and Tempo, visualized and alerted in Grafana, with long-term archive to S3 object storage">
  <style>
    :root{
      --card-fill:#0d1430; --card-stroke:#283254; --label:rgba(255,255,245,.88); --grouplabel:#7a85a0;
      --panel-fill:#0a1130; --panel-stroke:#2c3768;
      --chip-fill:rgba(100,108,255,.16); --chip-stroke:#3a4796; --chip-text:#b9c0ff;
      --muted:#7a85a0; --arrow:#4a5478; --arrow-bold:#8b97ff;
      --band-fill:#0a1030; --band-stroke:#2a3566; --band-title:#9aa3c0;
      --hdr1:#5c73e7; --hdr2:#4150c4; --hdr-text:#ffffff; --dot:#8b97ff;
    }
    .lbl{fill:var(--label);font-size:13.5px;font-weight:600}
    .grp{fill:var(--grouplabel);font-size:11.5px;font-weight:700;letter-spacing:1.5px}
    .chip{fill:var(--chip-text);font-size:12.5px;font-weight:600}
    .mut{fill:var(--muted);font-size:11px}
    .hdr{fill:var(--hdr-text);font-weight:700;font-size:15px}
    .bt{fill:var(--band-title);font-size:11px;font-weight:700;letter-spacing:1px}
  </style>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hdr1)"/><stop offset="1" stop-color="var(--hdr2)"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow)"/></marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow-bold)"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/></filter>
  </defs>

  <text class="grp" x="115" y="52" text-anchor="middle">SOURCES</text>
  <text class="grp" x="330" y="52" text-anchor="middle">COLLECT</text>
  <text class="grp" x="545" y="52" text-anchor="middle">STORE</text>
  <text class="grp" x="785" y="52" text-anchor="middle">VISUALIZE &amp; ALERT</text>

  <g>
    <rect x="40" y="78" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="101" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="106">Applications</text>
    <rect x="40" y="136" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="159" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="164">Kubernetes</text>
    <rect x="40" y="194" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="217" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="222">API Gateway</text>
    <rect x="40" y="252" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="275" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="280">Databases</text>
  </g>

  <path d="M190,101 L252,160" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M190,159 L252,183" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M190,217 L252,200" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,275 L252,223" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>

  <g filter="url(#sh)">
    <rect x="255" y="120" width="150" height="166" rx="14" fill="var(--panel-fill)" stroke="var(--panel-stroke)"/>
    <path d="M255,134 a14,14 0 0 1 14,-14 h122 a14,14 0 0 1 14,14 v30 h-150 z" fill="url(#hdr)"/>
    <text class="hdr" x="330" y="149" text-anchor="middle">Grafana Alloy</text>
    <rect x="275" y="178" width="110" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="330" y="195" text-anchor="middle">Metrics</text>
    <rect x="275" y="212" width="110" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="330" y="229" text-anchor="middle">Logs</text>
    <rect x="275" y="246" width="110" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="330" y="263" text-anchor="middle">Traces</text>
  </g>

  <path d="M405,191 L466,141" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8" marker-end="url(#ahb)"/>
  <path d="M405,225 L466,225" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8" marker-end="url(#ahb)"/>
  <path d="M405,259 L466,309" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8" marker-end="url(#ahb)"/>

  <g>
    <rect x="470" y="118" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="490" cy="141" r="5" fill="var(--dot)"/><text class="lbl" x="506" y="139">Mimir</text>
    <text class="mut" x="506" y="153">metrics</text>
    <rect x="470" y="202" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="490" cy="225" r="5" fill="var(--dot)"/><text class="lbl" x="506" y="223">Loki</text>
    <text class="mut" x="506" y="237">logs</text>
    <rect x="470" y="286" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="490" cy="309" r="5" fill="var(--dot)"/><text class="lbl" x="506" y="307">Tempo</text>
    <text class="mut" x="506" y="321">traces</text>
  </g>

  <path d="M620,141 L686,180" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M620,225 L686,215" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M620,309 L686,250" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>

  <g filter="url(#sh)">
    <rect x="690" y="130" width="190" height="170" rx="14" fill="var(--panel-fill)" stroke="var(--panel-stroke)"/>
    <path d="M690,144 a14,14 0 0 1 14,-14 h162 a14,14 0 0 1 14,14 v30 h-190 z" fill="url(#hdr)"/>
    <text class="hdr" x="785" y="159" text-anchor="middle">Grafana</text>
    <rect x="715" y="188" width="140" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="785" y="205" text-anchor="middle">Dashboards</text>
    <rect x="715" y="222" width="140" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="785" y="239" text-anchor="middle">Alerting</text>
    <rect x="715" y="256" width="140" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="785" y="273" text-anchor="middle">Explore &amp; search</text>
  </g>

  <path d="M785,300 L785,330" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="700" y="334" width="170" height="28" rx="14" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
  <text class="chip" x="785" y="352" text-anchor="middle">Email · Webhook</text>

  <path d="M545,332 L545,372" fill="none" stroke="var(--arrow)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <g>
    <rect x="430" y="376" width="230" height="58" rx="12" fill="var(--band-fill)" stroke="var(--band-stroke)"/>
    <text class="bt" x="545" y="398" text-anchor="middle">LONG-TERM ARCHIVE</text>
    <text class="lbl" x="545" y="418" text-anchor="middle">S3 Object Storage</text>
  </g>
  <text class="mut" x="620" y="356" text-anchor="middle">past hot retention</text>

  <text class="mut" x="115" y="330" text-anchor="middle">metrics ≥ 365 days · traces ≥ 90 days</text>
  <text class="mut" x="115" y="346" text-anchor="middle">logs ≥ 90 days hot, then archive</text>
  <text class="mut" x="115" y="430" text-anchor="middle">100% on-premise —</text>
  <text class="mut" x="115" y="444" text-anchor="middle">no data leaves your network</text>
</svg>
