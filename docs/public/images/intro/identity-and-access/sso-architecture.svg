<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Opstella Identity and Access architecture: developers, operations and administrators sign in once through Keycloak single sign-on with RBAC and OTP, reaching the Opstella portal and all DevSecOps tools, with login events shipped to centralized logging">
  <style>
    :root{
      --card-fill:#f3f5fa; --card-stroke:#dfe3ec; --label:#33384a; --grouplabel:#8a93a3;
      --panel-fill:#f9faff; --panel-stroke:#cdd6f4;
      --chip-fill:#eef1fd; --chip-stroke:#cfd8f6; --chip-text:#2f3e8c;
      --muted:#8a93a3; --arrow:#aab2c2; --arrow-bold:#3a5ccc;
      --band-fill:#f4f6fd; --band-stroke:#d6ddf5; --band-title:#6b7280;
      --hdr1:#3a5ccc; --hdr2:#2f49a6; --hdr-text:#ffffff; --dot:#5672cd;
    }
    .lbl{fill:var(--label);font-size:13.5px;font-weight:600}
    .grp{fill:var(--grouplabel);font-size:11.5px;font-weight:700;letter-spacing:1.5px}
    .chip{fill:var(--chip-text);font-size:12px;font-weight:600}
    .mut{fill:var(--muted);font-size:11px}
    .hdr{fill:var(--hdr-text);font-weight:700;font-size:15px}
    .bt{fill:var(--band-title);font-size:11px;font-weight:700;letter-spacing:1px}
  </style>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hdr1)"/><stop offset="1" stop-color="var(--hdr2)"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow)"/></marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow-bold)"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2b6b" flood-opacity="0.12"/></filter>
  </defs>

  <text class="grp" x="115" y="52" text-anchor="middle">USERS</text>
  <text class="grp" x="460" y="52" text-anchor="middle">IDENTITY PROVIDER</text>
  <text class="grp" x="785" y="52" text-anchor="middle">PLATFORM TOOLS</text>

  <g>
    <rect x="40" y="92" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="115" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="120">Developers</text>
    <rect x="40" y="150" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="173" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="178">Operations</text>
    <rect x="40" y="208" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="231" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="236">Administrators</text>
  </g>

  <path d="M190,115 L296,160" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M190,173 L296,178" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M190,231 L296,196" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <text class="mut" x="243" y="148" text-anchor="middle">sign in once</text>

  <g filter="url(#sh)">
    <rect x="300" y="80" width="320" height="226" rx="14" fill="var(--panel-fill)" stroke="var(--panel-stroke)"/>
    <path d="M300,94 a14,14 0 0 1 14,-14 h292 a14,14 0 0 1 14,14 v32 h-320 z" fill="url(#hdr)"/>
    <text class="hdr" x="460" y="100" text-anchor="middle">Keycloak — Single Sign-On</text>
    <rect x="322" y="130" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="388" y="147" text-anchor="middle">OpenID Connect</text>
    <rect x="466" y="130" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="532" y="147" text-anchor="middle">SAML 2.0</text>
    <rect x="322" y="164" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="388" y="181" text-anchor="middle">RBAC roles</text>
    <rect x="466" y="164" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="532" y="181" text-anchor="middle">OTP / MFA</text>
    <rect x="322" y="198" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="388" y="215" text-anchor="middle">Password policies</text>
    <rect x="466" y="198" width="132" height="26" rx="13" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/>
    <text class="chip" x="532" y="215" text-anchor="middle">Web user admin</text>
    <text class="mut" x="460" y="248" text-anchor="middle">every sign-in and sign-out recorded:</text>
    <text class="mut" x="460" y="263" text-anchor="middle">time · IP address · browser</text>
    <text class="mut" x="460" y="290" text-anchor="middle">LDAP / Active Directory federation</text>
  </g>

  <path d="M620,140 L686,112" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8"/>
  <path d="M620,170 L686,160" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8"/>
  <path d="M620,200 L686,208" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8" marker-end="url(#ahb)"/>
  <path d="M620,230 L686,256" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8"/>
  <path d="M620,255 L686,304" fill="none" stroke="var(--arrow-bold)" stroke-width="1.8"/>

  <g>
    <rect x="690" y="88" width="190" height="40" rx="10" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="708" cy="108" r="5" fill="var(--dot)"/><text class="lbl" x="722" y="113">Opstella Portal</text>
    <rect x="690" y="136" width="190" height="40" rx="10" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="708" cy="156" r="5" fill="var(--dot)"/><text class="lbl" x="722" y="161">GitLab</text>
    <rect x="690" y="184" width="190" height="40" rx="10" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="708" cy="204" r="5" fill="var(--dot)"/><text class="lbl" x="722" y="209">Grafana</text>
    <rect x="690" y="232" width="190" height="40" rx="10" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="708" cy="252" r="5" fill="var(--dot)"/><text class="lbl" x="722" y="257">ArgoCD</text>
    <rect x="690" y="280" width="190" height="40" rx="10" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="708" cy="300" r="5" fill="var(--dot)"/><text class="lbl" x="722" y="305">Harbor · SonarQube</text>
  </g>

  <path d="M460,306 L460,344" fill="none" stroke="var(--arrow)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <g>
    <rect x="310" y="348" width="300" height="46" rx="12" fill="var(--band-fill)" stroke="var(--band-stroke)"/>
    <text class="bt" x="460" y="367" text-anchor="middle">AUDIT TRAIL</text>
    <text class="mut" x="460" y="383" text-anchor="middle">login events shipped to centralized logging</text>
  </g>
</svg>
