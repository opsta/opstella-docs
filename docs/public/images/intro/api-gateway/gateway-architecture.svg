<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Opstella API Gateway architecture: clients connect through a single gateway with authentication, rate limiting, access control, caching, circuit breaking and TLS/mTLS to upstream services, with full observability via the LGTM stack">
  <style>
    :root{
      --card-fill:#f3f5fa; --card-stroke:#dfe3ec; --label:#33384a; --grouplabel:#8a93a3;
      --panel-fill:#f9faff; --panel-stroke:#cdd6f4;
      --chip-fill:#eef1fd; --chip-stroke:#cfd8f6; --chip-text:#2f3e8c;
      --muted:#8a93a3; --arrow:#aab2c2; --arrow-bold:#3a5ccc;
      --band-fill:#f4f6fd; --band-stroke:#d6ddf5; --band-title:#6b7280;
      --hdr1:#3a5ccc; --hdr2:#2f49a6; --hdr-text:#ffffff; --dot:#5672cd;
    }
    .lbl{fill:var(--label);font-size:13.5px;font-weight:600}
    .grp{fill:var(--grouplabel);font-size:11.5px;font-weight:700;letter-spacing:1.5px}
    .chip{fill:var(--chip-text);font-size:12.5px;font-weight:600}
    .mut{fill:var(--muted);font-size:11px}
    .hdr{fill:var(--hdr-text);font-weight:700;font-size:16px}
    .bt{fill:var(--band-title);font-size:11px;font-weight:700;letter-spacing:1px}
    .pill{font-size:12px;font-weight:700}
  </style>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hdr1)"/><stop offset="1" stop-color="var(--hdr2)"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow)"/></marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--arrow-bold)"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a2b6b" flood-opacity="0.12"/></filter>
  </defs>

  <!-- group labels -->
  <text class="grp" x="115" y="60" text-anchor="middle">CLIENTS</text>
  <text class="grp" x="805" y="60" text-anchor="middle">UPSTREAM SERVICES</text>

  <!-- client cards -->
  <g>
    <rect x="40" y="120" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="143" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="148">Web App</text>
    <rect x="40" y="178" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="201" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="206">Mobile App</text>
    <rect x="40" y="236" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="60" cy="259" r="5" fill="var(--dot)"/><text class="lbl" x="76" y="264">Partner API</text>
  </g>

  <!-- converging arrows (single entry point) -->
  <path d="M190,143 L250,201" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M190,201 L250,201" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <path d="M190,259 L250,201" fill="none" stroke="var(--arrow)" stroke-width="1.6"/>
  <circle cx="250" cy="201" r="4" fill="var(--arrow-bold)"/>
  <path d="M250,201 L296,201" fill="none" stroke="var(--arrow-bold)" stroke-width="2.6" marker-end="url(#ahb)"/>

  <!-- gateway panel -->
  <rect x="300" y="96" width="320" height="212" rx="16" fill="var(--panel-fill)" stroke="var(--panel-stroke)" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M300,142 L300,112 Q300,96 316,96 L604,96 Q620,96 620,112 L620,142 Z" fill="url(#hdr)"/>
  <text class="hdr" x="460" y="125" text-anchor="middle">API Gateway</text>

  <!-- feature chips -->
  <g>
    <rect x="316" y="158" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="385" y="180" text-anchor="middle">Authentication</text>
    <rect x="466" y="158" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="535" y="180" text-anchor="middle">Rate Limiting</text>
    <rect x="316" y="200" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="385" y="222" text-anchor="middle">Access Control</text>
    <rect x="466" y="200" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="535" y="222" text-anchor="middle">Response Caching</text>
    <rect x="316" y="242" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="385" y="264" text-anchor="middle">Circuit Breaker</text>
    <rect x="466" y="242" width="138" height="34" rx="9" fill="var(--chip-fill)" stroke="var(--chip-stroke)"/><text class="chip" x="535" y="264" text-anchor="middle">TLS / mTLS</text>
  </g>
  <text class="mut" x="460" y="299" text-anchor="middle">Powered by Apache APISIX</text>

  <!-- diverging arrows -->
  <path d="M624,201 L668,201" fill="none" stroke="var(--arrow-bold)" stroke-width="2.6"/>
  <circle cx="670" cy="201" r="4" fill="var(--arrow-bold)"/>
  <path d="M670,201 L726,143" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M670,201 L726,201" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M670,201 L726,259" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- service cards -->
  <g>
    <rect x="730" y="120" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="750" cy="143" r="5" fill="var(--dot)"/><text class="lbl" x="766" y="148">Payment API</text>
    <rect x="730" y="178" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="750" cy="201" r="5" fill="var(--dot)"/><text class="lbl" x="766" y="206">Core Service</text>
    <rect x="730" y="236" width="150" height="46" rx="11" fill="var(--card-fill)" stroke="var(--card-stroke)"/>
    <circle cx="750" cy="259" r="5" fill="var(--dot)"/><text class="lbl" x="766" y="264">Legacy System</text>
  </g>

  <!-- telemetry arrow -->
  <path d="M460,308 L460,342" fill="none" stroke="var(--arrow)" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ah)"/>

  <!-- observability band -->
  <rect x="300" y="344" width="320" height="104" rx="14" fill="var(--band-fill)" stroke="var(--band-stroke)"/>
  <text class="bt" x="460" y="372" text-anchor="middle">OBSERVABILITY · LGTM STACK</text>
  <g class="pill">
    <rect x="316" y="384" width="66" height="30" rx="8" fill="#f4b740"/><text x="349" y="404" text-anchor="middle" fill="#4a3500">Loki</text>
    <rect x="390" y="384" width="66" height="30" rx="8" fill="#f46800"/><text x="423" y="404" text-anchor="middle" fill="#ffffff">Grafana</text>
    <rect x="464" y="384" width="66" height="30" rx="8" fill="#7c5cff"/><text x="497" y="404" text-anchor="middle" fill="#ffffff">Tempo</text>
    <rect x="538" y="384" width="66" height="30" rx="8" fill="#16a394"/><text x="571" y="404" text-anchor="middle" fill="#ffffff">Mimir</text>
  </g>
  <text class="mut" x="460" y="436" text-anchor="middle">Metrics · Logs · Traces · Dashboards · Alerts</text>
</svg>
